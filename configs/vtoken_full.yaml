# TCRFoundation JOINT V-TOKEN -- FULL cluster run (via the library: `python -m tcr_foundation.train`).
# Same tiny per-chain backbone + V-token/alpha-detach design as foundation_joint_vtoken_tiny.yaml, but the REAL
# run: ALL paired sources (OTS+pan+Tanno), the real Emerson uniform-train corpus, batch 512 (cluster GPU),
# Linux workers. epochs here is a DEFAULT -- override per job with `--epochs N` (kept customizable).
# Paths are relative to scripts/ (the SLURM job cd's there). PREREQ on the cluster: the V-token tokenizer dir
# models/tokenizers/tcr-vtoken (+ vgene_map.json) must be present (rsync from local, or rebuild via
# scripts/utils/data_build/build_vtoken_tokenizer.py) -- models/ is gitignored.

# ---- architecture (tiny + per-chain RPE) ----
hidden_size:             128
num_hidden_layers:       4
num_attention_heads:     4
intermediate_size:       512
max_position_embeddings: 64
position_embedding_type: relative_key_query
type_vocab_size:         2
vocab_size:              128         # AA + specials + 101 V-gene tokens + [V_UNK]  (tcr-vtoken tokenizer)

# ---- V-token tokenizer + input format ----
tokenizer_path:  ../models/tokenizers/tcr-vtoken
vgene_map_path:  ../models/tokenizers/tcr-vtoken/vgene_map.json
input_format:    vtoken

# ---- pooler ----
pooling: mixed
dropout: 0.1

# ---- data: ALL paired sources + real Emerson uniform-train ----
paired_data_path: ../data/processed/pretrain_unique_paired_sequences.tsv
dataset_sources:  null                # null = OTS + pan_disease + Tanno_2020 (all)
emerson_data_path: ../data/processed/emerson_uniform_train.parquet   # real corpus (cluster)
emerson_per_epoch: null               # null = match paired count (~50/50)
max_len_paired: 96
max_len_beta:   64

# ---- augmentation (CDR3 censoring + MLM; V-token germline -> never masked) ----
mlm_prob:          0.15
censor_apply_prob: 0.5
censor_res_prob:   0.20

# ---- loss weights (alpha DETACHED: drop_alpha=0 + alpha SimCSE; beta chain-drop kept) ----
lambda_mlm:          1.0
lambda_pair:         1.0
lambda_drop_beta:    1.0
lambda_drop_alpha:   0.0
lambda_alpha_simcse: 1.0
lambda_betaonly:     1.0
temperature:         0.05

# ---- optimization ----
batch_size:   512                     # cluster GPU (locally 512 OOM'd an 8GB card -> the local run used 128)
lr:           3.0e-4
warmup_frac:  0.05
weight_decay: 0.01
epochs:       3                       # DEFAULT -- override with --epochs N per job
seed:         42
use_amp:      true
max_grad_norm: 1.0
num_workers:  8                       # Linux cluster (MUST be 0 on Windows)

# ---- output (distinct dir -- do NOT overwrite the local 1-epoch -vtoken-tiny checkpoint) ----
save_path: ../models/foundation/tcr-foundation-joint-vtoken

# ---- comet ----
comet_workspace: ilyada
comet_project:   tcr_foundation
