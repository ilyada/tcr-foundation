# tcr_foundation -- installable TCR repertoire library (encoders / descriptors / metrics / registry).
#
# ISOLATION NOTE (first cut): this whole directory is self-contained. Deleting `tcr_foundation/` at the
# repo root reverts the project to its prior state -- nothing outside this folder is modified, and the
# package is NOT pip-installed (import via sys.path in tests) so there is no stray .pth/.egg-link in any
# environment. Heavy deps are optional extras; the core stays light.
[build-system]
requires = ["setuptools>=77"]        # >=77 for the PEP 639 `license`/`license-files` fields used below
build-backend = "setuptools.build_meta"

[project]
name = "tcr-foundation"
version = "0.1.0"                     # 0.1.0: first version that installs correctly from a wheel (_vendor ships)
description = "TCR repertoire library: clonotype encoders, repertoire descriptors, donor-centric metrics, model registry."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ilya Dyugay", email = "dyugay.ilya@gmail.com" }]
keywords = ["TCR", "immunology", "repertoire", "AIRR", "representation-learning"]
# Core stays light (analysis-only): no torch/transformers here -- those live in the [neural] extra.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
]

[project.optional-dependencies]
# Heavy / backend-specific deps, opt-in so `pip install tcr-foundation` for pure analysis stays light.
neural = ["torch", "transformers", "tidytcells"]   # neural clonotype encoder (our foundation model)
sceptr = ["sceptr"]                                 # SCEPTR baseline encoder
tcrdist-ref = ["tcrdist3"]                           # reference TCRdist -- validation oracle only
hf = ["huggingface_hub"]                             # model registry: HF Hub weight backend (added last)
train = ["torch", "transformers", "tidytcells", "comet_ml", "pyyaml", "huggingface_hub"]  # launch pretraining via the library
test = ["pytest"]

[project.scripts]
# `tcr-foundation-train --config ...` after `pip install -e .` -- launches the joint pretraining (Phase-1 wrapper).
tcr-foundation-train = "tcr_foundation.train:cli"

[tool.setuptools.packages.find]
where = ["."]
# `namespaces = true` is what pulls in the vendored pipeline: tcr_foundation/_vendor/{repertoire,foundation,config}
# carry NO __init__.py (they are imported as top-level modules off sys.path), so a plain find_packages would
# skip them and the wheel would ship a package that cannot import `repertoire`.
include = ["tcr_foundation*"]
exclude = ["tests*"]
namespaces = true

[tool.setuptools.package-data]
# The vendored trainer reads its YAML configs from disk -- ship the non-.py files too, or `pip install .`
# produces a package whose training entrypoint has no configs.
"tcr_foundation" = ["_vendor/**/*.yaml", "_vendor/**/*.yml", "_vendor/**/*.json", "_vendor/**/*.txt", "configs/*.yaml"]
