# TCRFoundation Stage 1 (TINY + per-chain RPE): beta-only MLM + InfoNCE on Emerson.
# See Knowledge_Base/project_TCRFoundation/context/experiments/stage1_beta_backbone.md
# Backbone uses PerChainRelativeSelfAttention (per-chain relative positions reset at the
# chain boundary + a cross-chain bucket) so the beta-only backbone transfers to paired
# Stage 2 via a thin LoRA. All paths relative to scripts/.

# ---- Backbone architecture: TINY + per-chain RPE ----
hidden_size: 128
num_hidden_layers: 4
num_attention_heads: 4
intermediate_size: 512
max_position_embeddings: 64        # per-chain table (covers per-chain length <= 47)
position_embedding_type: relative_key_query   # informational; attention is swapped to per-chain
type_vocab_size: 2                 # alpha=0, beta=1
vocab_size: 26                     # wukevin tokenizer
hidden_act: gelu
hidden_dropout_prob: 0.1
attention_probs_dropout_prob: 0.1

# ---- Pooler beta ----
pooling: mixed
dropout: 0.1

# ---- Loss ----
lambda_mlm: 1.0
lambda_pair: 1.0
temperature: 0.05

# ---- Augmentation ----
mlm_prob: 0.15
censor_apply_prob: 0.5
censor_res_prob: 0.20

# ---- Optimization ----
batch_size: 1024
lr: 5.0e-4
warmup_frac: 0.05
weight_decay: 0.01
epochs: 5
seed: 42
max_len: 64                        # single beta chain (<= 47 tokens)
use_amp: true
num_workers: 0

# ---- Paths (relative to scripts/) ----
data_path: ../data/processed/emerson_uniform_train.parquet
save_path: ../models/foundation/tcr-foundation-tiny

# B1 evaluation uses ../data/processed/emerson_uniform_holdout.parquet (separate, post-train).

# ---- Comet ----
comet_workspace: ilyada
comet_project: tcr_foundation
